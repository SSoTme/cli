name: Legacy characterization

on:
  pull_request:
  push:
    branches:
      - effortless-cli

concurrency:
  group: legacy-characterization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  characterization:
    name: Characterization (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run legacy characterization suite
        if: runner.os != 'Windows'
        run: ./scripts/test-legacy.sh --filter "Slow!=true"

      - name: Run legacy characterization suite
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-legacy.ps1 --filter "Slow!=true"

      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/**"
          if-no-files-found: ignore

  slow:
    name: Slow characterization
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run slow legacy characterization tests
        run: ./scripts/test-legacy.sh --filter "Slow=true"
