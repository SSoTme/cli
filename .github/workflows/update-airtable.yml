# Records the released CLI version and installer asset URLs in the Airtable
# CLIVersions table.
# Required repository secrets:
#   AIRTABLE_PAT                 - Airtable personal access token
#   EFFORTLESS_AIRTABLE_BASE_ID  - the Airtable base id (formerly SSOT_BASE_ID; the
#                                  script still falls back to SSOT_BASE_ID until the
#                                  secret is renamed in the repository settings)
name: Update Airtable with Latest Version

on:
  push:
    branches: [ 'main' ]

jobs:
  update-airtable:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        pip install -r scripts/ci/requirements.txt
    
    - name: Get version from package.json
      id: get_version
      run: |
        VERSION=$(grep '"version"' package.json | cut -d'"' -f4)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"
    
    - name: Update Airtable with new version
      run: |
        python scripts/ci/add_latest_version_to_airtable_db.py --version "${{ steps.get_version.outputs.version }}"
      env:
        AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        EFFORTLESS_AIRTABLE_BASE_ID: ${{ secrets.EFFORTLESS_AIRTABLE_BASE_ID }}
        SSOT_BASE_ID: ${{ secrets.SSOT_BASE_ID }}
        GITHUB_REPOSITORY: ${{ github.repository }}
    
    - name: Workflow summary
      run: |
        echo "## Airtable Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Version: ${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
        echo "- Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
